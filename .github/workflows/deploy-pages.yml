# 构建并部署到 GitHub Pages
# 说明：本仓库是用户站点（<user>.github.io），Pages 源选择 master 分支的 /docs 目录。
# 首次使用请到仓库 Settings -> Pages -> Source 选择 "master branch /docs folder"。
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare docs folder for Pages
        run: |
          rm -rf docs
          cp -r dist docs
          touch docs/.nojekyll

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: master
          publish_dir: ./docs
          keep_files: false
